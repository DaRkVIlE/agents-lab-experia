version: 1.0.5

cache: true

# =============================================================================
# COMMERCIAL AI BOTS — Platform Dashboard (by Experia Solutions)
# =============================================================================

interface:
  endpointSettings: false
  parameters: false
  modelSelect: true
  agents:
    use: false
    create: false
    share: false
    public: false

# registration:
#   socialLogins: []
#   allowedDomains: []

endpoints:
  agents:
    disableBuilder: false
  custom:
    - name: "🧠 KAIROX Engine (Groq)"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["llama-3.1-70b-versatile"]
        fetch: false
      titleConvo: true
      titleModel: "llama-3.1-70b-versatile"
      modelDisplayLabel: "KAIROX"
      iconURL: "https://img.icons8.com/fluency/96/brain.png"
      addParams:
        max_tokens: 1200
        temperature: 0.70
