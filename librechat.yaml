version: 1.0.5

cache: true

# =============================================================================
# COMMERCIAL AI BOTS — Platform Dashboard (by Experia Solutions)
# =============================================================================

interface:
  endpointSettings: false
  parameters: false
  modelSelect: true
  agents:
    use: true
    create: false
    share: false
    public: false

mcpServers:
  experia-calibration:
    type: "sse"
    url: "http://localhost:3001/sse"

# registration:
#   socialLogins: []
#   allowedDomains: []

endpoints:
  agents:
    disableBuilder: false
  custom:
    - name: "🧠 KAIROX Engine (Groq)"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["llama-3.3-70b-versatile"]
        fetch: false
      titleConvo: true
      titleModel: "llama-3.3-70b-versatile"
      modelDisplayLabel: "KAIROX"
      iconURL: "https://img.icons8.com/fluency/96/brain.png"
      addParams:
        max_tokens: 1200
        temperature: 0.70
        chatgptLabel: "KAIROS"

modelSpecs:
  enforce: false
  list:
    - name: "onboarding-gestor"
      label: "Treinar Novo Bot"
      description: "Fluxo de onboarding para calibrar seu novo bot de atendimento."
      iconURL: "https://img.icons8.com/color/96/bot.png"
      default: true
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Ajudante de Configuração"
        promptPrefix: "Você é o assistente de onboarding da Experia. Sua missão é entrevistar o gestor em 5 passos rápidos para extrair: 1. Nome do negócio, 2. Tom de voz, 3. Serviços, 4. Regras de negócio, 5. Exemplos de respostas. Ao final do passo 5, você OBRIGATORIAMENTE DEVE retornar um bloco JSON com todos esses dados consolidados."
    - name: "teste-paulo-servicos"
      label: "Simulador: Paulo Serviços"
      description: "Simulador para testar como o bot do Paulo Serviços atende."
      iconURL: "https://img.icons8.com/color/96/plumber.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Bot do Paulo"
        promptPrefix: "Você é o assistente virtual do Paulo Serviços. Você deve testar a configuração atualizada."
    - name: "teste-aida-tutor"
      label: "Simulador: AIDA Tutor"
      description: "Simulador para testar a AIDA Tutor de Idiomas."
      iconURL: "https://img.icons8.com/color/96/reading.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "AIDA"
        promptPrefix: "Você é AIDA, a tutora imersiva. Teste a conversação."
    - name: "felix-cell-mission-control"
      label: "🎛️ Felix Cell — Mission Control"
      description: "Painel de Comando e Calibração da Squad Felix Cell (Supervisão do Felix)."
      iconURL: "https://img.icons8.com/color/96/control-panel.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Mission Control"
        promptPrefix: "Você é o Mission Control da Squad Felix Cell. Seu papel é atuar como copiloto de calibração, gestão de regras e roteamento da squad do Felix Cell. Você ajuda o Felix a ajustar horários, serviços, faixas de preços e analisar relatórios de triagem e reclamações."
    - name: "felix-cell-felicia"
      label: "📱 Simulador: Felícia (Atendimento 24/7)"
      description: "Simulação da Felícia — Atendimento e triagem técnica via WhatsApp Felix Cell."
      iconURL: "https://img.icons8.com/color/96/iphone.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Felícia"
        promptPrefix: "Olá! Sou a Felícia, assistente virtual da Felix Cell 📱 Somos especialistas em conserto de celulares em Mauá e região. Você é uma recepcionista técnica de celulares em Mauá. Não revele que é IA. Faça triagem conversacional (marca, modelo, defeito) sem passar preços fechados."
    - name: "felix-cell-bancada"
      label: "🛠️ Simulador: Bancada (Assistente Técnico)"
      description: "Assistente interno da bancada do Felix — Orçamentos, OS e consultas técnicas."
      iconURL: "https://img.icons8.com/color/96/wrench.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Copiloto Bancada"
        promptPrefix: "Você é a Bancada, assistente interno técnico do Felix. Você rascunha orçamentos, registra OS por áudio e responde a dúvidas técnicas de bancada em tom de técnico para técnico."
    - name: "felix-cell-reclamacoes"
      label: "🛡️ Simulador: Reclamações & Pós-Serviço"
      description: "Acolhimento empático de reclamações e orientações sobre garantia de 90 dias."
      iconURL: "https://img.icons8.com/color/96/shield.png"
      preset:
        endpoint: "custom"
        model: "llama3-70b-8192"
        chatGptLabel: "Gestão Reclamações"
        promptPrefix: "Você é o assistente de Reclamações e Pós-Serviço da Felix Cell. Seu objetivo é acolher clientes insatisfeitos com empatia, explicar a garantia de 90 dias e direcionar o cliente à loja sem prometer soluções financeiras antes da avaliação."
